# SPDX-License-Identifier: GPL-2.0-or-later
name: LEM iOS 16 core compatibility
on:
  workflow_dispatch:
    inputs:
      full_build:
        description: Rebuild native Core, GPU and Runtime
        type: boolean
        default: false
      runtime_build:
        description: Rebuild Runtime with verified GPU (otherwise reuse Build 58)
        type: boolean
        default: false
  push:
    branches: [lem-ios16-legacy]
permissions:
  contents: read
  actions: read
concurrency:
  group: legacy-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build }}
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          xcodebuild -version
          brew install cmake ninja
      - name: Verify deployment floor
        shell: bash
        run: |
          mkdir -p .build/legacy-logs
          set -o pipefail
          python3 tests/tooling/cmake/test_apple_deployment_floor.py --cmake "$(command -v cmake)" --toolchain cmake/toolchains/Apple.cmake 2>&1 | tee .build/legacy-logs/floor.log
      - name: Configure iOS 16 core without GPU or guest kernel
        shell: bash
        run: |
          set -o pipefail
          cmake --preset ios-device -B .build/legacy-core -DCMAKE_CXX_FLAGS=-Werror=unguarded-availability-new -DCMAKE_OBJCXX_FLAGS=-Werror=unguarded-availability-new 2>&1 | tee .build/legacy-logs/configure.log
      - name: Compile iOS 16 core
        shell: bash
        run: |
          set -o pipefail
          cmake --build .build/legacy-core --parallel 2 2>&1 | tee .build/legacy-logs/build.log
      - name: Compile actual ELF loader for iOS 16
        shell: bash
        run: |
          set -o pipefail
          cmake --preset ios-device -B .build/legacy-loader \
            -DUML_BUILD_KERNEL_RUNNER=ON \
            -DCMAKE_CXX_FLAGS=-Werror=unguarded-availability-new \
            -DCMAKE_OBJCXX_FLAGS=-Werror=unguarded-availability-new \
            2>&1 | tee .build/legacy-logs/loader-configure.log
          cmake --build .build/legacy-loader --target uml_emulator --parallel 2 \
            2>&1 | tee .build/legacy-logs/loader-build.log
      - name: Inspect accepted Android kernel and Mach-O carrier
        shell: bash
        run: |
          set -o pipefail
          (
            set -e
            mkdir -p .build/legacy-carrier
            curl -fL --retry 3 -o .build/legacy-carrier/kernel.tar.gz \
              https://github.com/imxieyi/Kernarium/releases/download/andarium-1.1/android-6.18-arm64-4k-20261119-6.18.60-ca1.tar.gz
            tar -xzf .build/legacy-carrier/kernel.tar.gz -C .build/legacy-carrier
            image="$(find .build/legacy-carrier -type f -path '*/kernel/vmlinux' -print -quit)"
            test -n "$image"
            python3 Kernarium/scripts/verify-signed-kernel-carrier.py --image "$image"
            printf 'int legacy_carrier_probe(void) { return 0; }\n' > .build/legacy-carrier/probe.c
            xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -dynamiclib \
              .build/legacy-carrier/probe.c \
              -Wl,-sectcreate,__TEXT,__uml_elf,"$image" \
              -Wl,-sectalign,__TEXT,__uml_elf,0x4000 \
              -o .build/legacy-carrier/CarrierProbe.dylib
            codesign --force --sign - .build/legacy-carrier/CarrierProbe.dylib
            codesign --verify --verbose=4 .build/legacy-carrier/CarrierProbe.dylib
            xcrun otool -l .build/legacy-carrier/CarrierProbe.dylib
            xcrun vtool -show-build .build/legacy-carrier/CarrierProbe.dylib
          ) 2>&1 | tee .build/legacy-logs/carrier.log
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lem-ios16-core-logs
          path: .build/legacy-logs/
          if-no-files-found: warn
  gpu:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build }}
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install GPU build tools
        run: |
          brew install cmake ninja meson pkgconf bison flex
          python3 -m venv .build/gpu-tools-venv
          .build/gpu-tools-venv/bin/pip install meson mako packaging pyyaml
      - name: Prepare authenticated GPU sources
        shell: bash
        run: |
          mkdir -p .build/legacy-gpu-logs
          set -o pipefail
          dependencies/prepare.sh --product apple-gpu-vulkan-experiment 2>&1 | tee .build/legacy-gpu-logs/prepare.log
      - name: Build verified iPhone softpipe GPU prefix
        shell: bash
        run: |
          set -o pipefail
          export PATH="$PWD/.build/gpu-tools-venv/bin:$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          dependencies/build-apple-gpu.sh --platform ios --jobs 3 2>&1 | tee .build/legacy-gpu-logs/gpu-build.log
      - name: Compile GPU device code for iOS 16
        shell: bash
        run: |
          set -o pipefail
          cmake --preset ios-device -B .build/legacy-gpu -DUML_BUILD_GPU=ON -DUML_BUILD_AUDIO=OFF 2>&1 | tee .build/legacy-gpu-logs/configure.log
          cmake --build .build/legacy-gpu --parallel 3 2>&1 | tee .build/legacy-gpu-logs/build.log
      - name: Upload GPU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lem-ios16-gpu-logs
          path: .build/legacy-gpu-logs/
          if-no-files-found: warn
      - name: Upload verified GPU prefix
        uses: actions/upload-artifact@v4
        with:
          name: lem-ios16-softpipe-prefix
          path: .build/dependencies/apple-gpu-vulkan-experiment/ios-device-arm64/
          if-no-files-found: error
  runtime:
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.full_build || inputs.runtime_build) && ((needs.gpu.result == 'success' && needs.core.result == 'success') || (needs.gpu.result == 'skipped' && needs.core.result == 'skipped')) }}
    needs: [gpu, core]
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reused GPU dependency sources
        if: ${{ needs.gpu.result == 'skipped' }}
        run: git diff --exit-code 36673a9dba53f82fe6a72fe46e31b14494b7f83e HEAD -- dependencies cmake/toolchains
      - name: Install runtime build tools
        run: |
          brew install cmake ninja meson pkgconf autoconf automake libtool
          python3 -m venv .build/gpu-tools-venv
          .build/gpu-tools-venv/bin/pip install meson mako packaging pyyaml
          mkdir -p .build/legacy-runtime-logs
      - name: Restore verified device GPU prefix
        if: ${{ needs.gpu.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: lem-ios16-softpipe-prefix
          path: .build/dependencies/apple-gpu-vulkan-experiment/ios-device-arm64/
      - name: Restore verified GPU prefix from baseline
        if: ${{ needs.gpu.result == 'skipped' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45772323010
          name: lem-ios16-softpipe-prefix
          path: .build/dependencies/apple-gpu-vulkan-experiment/ios-device-arm64/
      - name: Prepare and build iOS 16 network dependencies
        shell: bash
        run: |
          set -o pipefail
          dependencies/prepare.sh --product ios-network 2>&1 | tee .build/legacy-runtime-logs/network-prepare.log
          export PATH="$PWD/.build/gpu-tools-venv/bin:$PATH"
          dependencies/build-ios-network.sh --platform ios --jobs 3 2>&1 | tee .build/legacy-runtime-logs/network-build.log
      - name: Import accepted Android kernel
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .build/kernel/artifacts
          curl -fL --retry 3 -o .build/kernel/android.tar.gz \
            https://github.com/imxieyi/Kernarium/releases/download/andarium-1.1/android-6.18-arm64-4k-20261119-6.18.60-ca1.tar.gz
          tar -xzf .build/kernel/android.tar.gz -C .build/kernel/artifacts
          test -f .build/kernel/artifacts/android-6.18-arm64-4k-20261119-6.18.60-ca1/kernel/vmlinux
      - name: Configure Android runtime with audio, network and softpipe
        shell: bash
        run: |
          set -o pipefail
          cmake --preset kernarium-ios-device-android \
            -DUML_BUILD_AUDIO=ON \
            -DCMAKE_CXX_FLAGS=-Werror=unguarded-availability-new \
            -DCMAKE_OBJCXX_FLAGS=-Werror=unguarded-availability-new \
            2>&1 | tee .build/legacy-runtime-logs/configure.log
      - name: Compile and link Android runtime
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset kernarium-ios-device-android --target KernariumRuntime --parallel 3 \
            2>&1 | tee .build/legacy-runtime-logs/build.log
      - name: Inspect linked Android runtime
        shell: bash
        run: |
          set -o pipefail
          binary="$(find .build/kernarium-runtime-ios-device-android-4k -type f -name KRuntime_Android_6_18_4K -print -quit)"
          test -n "$binary"
          xcrun vtool -show-build "$binary" | tee .build/legacy-runtime-logs/macho.log
          xcrun otool -L "$binary" | tee -a .build/legacy-runtime-logs/macho.log
          xcrun nm -u "$binary" > .build/legacy-runtime-logs/undefined-symbols.log
          if grep -E '__ZN(K)?St3__13pmr' .build/legacy-runtime-logs/undefined-symbols.log; then
            echo "Unexpected dependency on iOS system PMR runtime"; exit 1
          fi
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lem-ios16-runtime-logs
          path: .build/legacy-runtime-logs/
          if-no-files-found: warn
      - name: Upload compiled Android framework
        uses: actions/upload-artifact@v4
        with:
          name: lem-ios16-android-runtime
          path: .build/kernarium-runtime-ios-device-android-4k/Kernarium/Runtime/KRuntime_Android_6_18_4K.framework/
          if-no-files-found: error
  app:
    needs: [gpu, runtime]
    if: ${{ always() && !cancelled() && ((needs.runtime.result == 'success' && (needs.gpu.result == 'success' || needs.gpu.result == 'skipped')) || (needs.runtime.result == 'skipped' && needs.gpu.result == 'skipped')) }}
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reused native sources match the baseline
        if: ${{ needs.runtime.result == 'skipped' }}
        shell: bash
        run: |
          git diff --exit-code 00bb7089780103c9530825fd81432715dbce0ca3 HEAD -- CMakeLists.txt CMakePresets.json cmake darwin kernel android dependencies Kernarium scripts
          echo "Reusing verified Runtime from Build 58 and GPU from Build 36"
      - name: Install legacy application build tools
        run: |
          xcodebuild -version
          command -v cmake >/dev/null && command -v ninja >/dev/null || brew install cmake ninja
          mkdir -p .build/legacy-app-logs .build/legacy-app-frameworks
      - name: Restore GPU prefix
        if: ${{ needs.gpu.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: lem-ios16-softpipe-prefix
          path: .build/legacy-app-gpu
      - name: Restore GPU prefix from verified baseline
        if: ${{ needs.gpu.result == 'skipped' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45772323010
          name: lem-ios16-softpipe-prefix
          path: .build/legacy-app-gpu
      - name: Restore compiled Android runtime
        if: ${{ needs.runtime.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: lem-ios16-android-runtime
          path: .build/legacy-app-frameworks/KRuntime_Android_6_18_4K.framework
      - name: Restore compiled Android runtime from verified baseline
        if: ${{ needs.runtime.result == 'skipped' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45796539926
          name: lem-ios16-android-runtime
          path: .build/legacy-app-frameworks/KRuntime_Android_6_18_4K.framework
      - name: Cache iOS 16 TAR reader
        id: archive_cache
        uses: actions/cache@v4
        with:
          path: .build/legacy-libarchive
          key: legacy-libarchive-3.8.5-ios16-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Build pinned TAR and gzip reader for iOS 16
        if: steps.archive_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/legacy-libarchive
          curl -fL --retry 3 -o .build/libarchive.tar.gz https://github.com/libarchive/libarchive/releases/download/v3.8.5/libarchive-3.8.5.tar.gz
          echo '8a60f3a7bfd59c54ce82ae805a93dba65defd04148c3333b7eaa2102f03b7ffd  .build/libarchive.tar.gz' | shasum -a 256 -c -
          tar -xzf .build/libarchive.tar.gz -C .build
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          cmake -S .build/libarchive-3.8.5 -B .build/libarchive-build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT="$sdk" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DZLIB_LIBRARY="$sdk/usr/lib/libz.tbd" -DZLIB_INCLUDE_DIR="$sdk/usr/include" \
            -DENABLE_ZLIB=ON -DENABLE_TEST=OFF -DENABLE_INSTALL=OFF \
            -DENABLE_OPENSSL=OFF -DENABLE_LIBB2=OFF -DENABLE_LZ4=OFF \
            -DENABLE_LZMA=OFF -DENABLE_ZSTD=OFF -DENABLE_BZip2=OFF \
            -DENABLE_LIBXML2=OFF -DENABLE_EXPAT=OFF -DENABLE_PCREPOSIX=OFF \
            -DENABLE_PCRE2POSIX=OFF -DENABLE_ICONV=OFF -DENABLE_ACL=OFF \
            -DENABLE_XATTR=OFF -DENABLE_TAR=OFF -DENABLE_CPIO=OFF \
            -DENABLE_CAT=OFF -DENABLE_UNZIP=OFF
          cmake --build .build/libarchive-build --target archive_static --parallel 4
          cp .build/libarchive-build/libarchive/libarchive.a .build/legacy-libarchive/
          cp .build/libarchive-3.8.5/libarchive/archive.h .build/libarchive-3.8.5/libarchive/archive_entry.h .build/legacy-libarchive/
          cp .build/libarchive-3.8.5/COPYING .build/legacy-libarchive/LICENSE-libarchive.txt
      - name: Compile minimal UIKit boot application for iOS 16
        shell: bash
        run: |
          set -o pipefail
          app=".build/legacy-app/Build/Products/Release-iphoneos/Andarium.app"
          mkdir -p "$app"
          cp Andarium/LegacyBoot/Info.plist "$app/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$app/Info.plist"
          xcrun --sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=16.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -std=c++23 -fobjc-arc -fblocks -O2 -Werror=unguarded-availability-new \
            -framework UIKit -framework Foundation -framework Metal -framework MetalKit -framework CoreGraphics -framework UniformTypeIdentifiers \
            -Wl,-rpath,@executable_path/Frameworks \
            -I.build/legacy-libarchive \
            Andarium/LegacyBoot/main.mm Andarium/LegacyBoot/ROMArchive.mm GuestHost/Sources/KernariumRuntimeLoader.mm \
            .build/legacy-libarchive/libarchive.a -lz \
            -o "$app/Andarium" 2>&1 | tee .build/legacy-app-logs/app-build.log
          xcrun vtool -show-build "$app/Andarium"
      - name: Assemble experimental iOS 16 IPA
        shell: bash
        run: |
          set -o pipefail
          app="$PWD/.build/legacy-package/Payload/Andarium.app"
          mkdir -p "$(dirname "$app")"
          cp -R .build/legacy-app/Build/Products/Release-iphoneos/Andarium.app "$app"
          mkdir -p "$app/Frameworks"
          cp .build/legacy-libarchive/LICENSE-libarchive.txt "$app/"
          for name in MesaEGL MesaGallium; do
            cp -R ".build/legacy-app-gpu/Frameworks/$name.framework" "$app/Frameworks/"
          done
          cp -R .build/legacy-app-frameworks/KRuntime_Android_6_18_4K.framework "$app/Frameworks/"
          for framework in "$app/Frameworks/"*.framework; do
            codesign --force --sign - "$framework"
            codesign --verify "$framework"
            xcrun vtool -show-build "$framework/$(basename "$framework" .framework)"
          done
          codesign --force --sign - --entitlements Andarium/Config/Andarium.entitlements "$app"
          codesign --verify --deep --strict "$app"
          xcrun vtool -show-build "$app/Andarium"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist"
          (cd .build/legacy-package && ditto -c -k --sequesterRsrc --keepParent Payload LEM-Andarium-Lite-iOS16.ipa)
          test -s .build/legacy-package/LEM-Andarium-Lite-iOS16.ipa
          test ! -e "$app/andarium-system"
          bytes="$(stat -f %z .build/legacy-package/LEM-Andarium-Lite-iOS16.ipa)"
          echo "Lite IPA size: $bytes bytes"
          test "$bytes" -lt 100000000
      - name: Upload application diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lem-ios16-app-logs
          path: .build/legacy-app-logs/
          if-no-files-found: warn
      - name: Upload experimental IPA
        uses: actions/upload-artifact@v4
        with:
          name: LEM-Andarium-Lite-iOS16
          path: .build/legacy-package/LEM-Andarium-Lite-iOS16.ipa
          if-no-files-found: error
